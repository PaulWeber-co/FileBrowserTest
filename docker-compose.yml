# SpeedNAS mit Docker Compose.
#
#   docker compose up -d        starten (im Hintergrund)
#   docker compose logs -f      zusehen
#   docker compose down         anhalten und entfernen
#
# Erklaerung jeder Zeile: docs/docker.md

# Ohne diese Zeile leitet Compose den Projektnamen aus dem Ordnernamen ab.
# Der Name taucht in "docker ps" und als Praefix der Netzwerke auf.
name: speednas

services:
  speednas:
    # Entweder selbst bauen ...
    build:
      context: .
      # runtime = mit ffmpeg (Video- und HEIC-Vorschauen)
      # slim    = minimal, ohne ffmpeg
      target: ${SPEEDNAS_TARGET:-runtime}
      args:
        VERSION: "1.0.0"
    # ... oder ein fertiges Image verwenden. Dann die vier Zeilen oben
    # auskommentieren und stattdessen hier den Namen setzen:
    # image: ghcr.io/paulweber-co/speednas:1.0.0

    image: speednas:local
    container_name: speednas

    # Nach einem Neustart des Rechners von selbst wieder hochfahren.
    # "unless-stopped" heisst: ausser du hast ihn ausdruecklich angehalten.
    restart: unless-stopped

    ports:
      # links der Port auf deinem Rechner, rechts der im Container.
      # Steht dort "8088:8088", ist SpeedNAS unter http://<deine-ip>:8088
      # erreichbar. Willst du nur lokal ran: "127.0.0.1:8088:8088".
      - "${SPEEDNAS_PORT:-8088}:8088"

    volumes:
      # Alles Veraenderliche liegt im benannten Volume "speednas-data".
      # Der Container darf jederzeit geloescht und neu erstellt werden -
      # Konfiguration, Benutzer und Freigabelinks bleiben erhalten.
      - speednas-data:/data

      # Alternative: ein Ordner auf dem Wirt, damit du hineinschauen kannst.
      # - ./daten:/data

      # Optional: ein lokaler Ordner, den SpeedNAS als Speicherort anbieten
      # soll (in der Oberflaeche dann als Typ "Lokaler Ordner" mit Pfad
      # /medien eintragen). :ro macht ihn schreibgeschuetzt.
      # - /srv/medien:/medien:ro

    environment:
      # Diese Werte kommen aus der .env-Datei daneben (start.sh legt sie an).
      # Hinter dem :- steht jeweils die Vorgabe, falls nichts gesetzt ist.
      TZ: ${TZ:-Europe/Berlin}       # sonst laufen alle Zeitangaben auf UTC
      PUID: ${PUID:-1000}            # Kennung, unter der der Dienst laeuft
      PGID: ${PGID:-1000}
      SPEEDNAS_LISTEN: ":8088"

      # Passwoerter gehoeren nicht in die Konfigurationsdatei. SpeedNAS
      # ersetzt ${NAS_PASSWORT} dort durch diesen Wert. Der Wert selbst
      # kommt aus einer .env-Datei neben dieser Datei (siehe .env.example).
      NAS_PASSWORT: ${NAS_PASSWORT:-}

    # Der Container braucht keine zusaetzlichen Rechte. Diese beiden Zeilen
    # verhindern, dass ein Prozess darin je mehr Rechte erlangen kann.
    security_opt:
      - no-new-privileges:true

    # Obergrenzen, damit ein Fehler im Container nicht den ganzen Rechner
    # lahmlegt. Bei vielen gleichzeitigen Vorschaubildern ruhig erhoehen.
    deploy:
      resources:
        limits:
          memory: 512M

    # Protokolle begrenzen, sonst fuellt sich die Platte ueber Monate.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    # ------------------------------------------------------------------
    # Netzwerk: Der Standard (Bridge) genuegt fuer den Speedport, weil
    # SpeedNAS die Verbindung nach aussen aufbaut - hinaus ins Heimnetz
    # kommt ein Container immer.
    #
    # "host" brauchst du nur, wenn SpeedNAS Geraete im Netz FINDEN soll
    # (mDNS/NetBIOS) oder wenn du keinen Port abbilden willst. Unter
    # Docker Desktop fuer Windows und Mac funktioniert host nur
    # eingeschraenkt; unter Linux und auf dem Raspberry Pi problemlos.
    #
    # network_mode: host        # dann den ports:-Block oben entfernen

volumes:
  speednas-data:
